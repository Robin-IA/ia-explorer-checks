# Weekly watch: Claude reads the sources in watch/sources.md, files an
# issue for each change the checks need, makes the changes, and records
# the run. Instructions: watch/weekly-watch-prompt.md.
#
# Runs Mondays at 05:00 UTC (midnight Eastern Standard Time, 1 a.m. in
# summer), and whenever started from the Actions tab: Weekly watch →
# Run workflow.
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`).

name: Weekly watch

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-watch
  cancel-in-progress: false

jobs:
  watch:
    # The mirror carries this file too; the watch runs only on the source.
    if: github.repository == 'Robin-IA/ia-explorer-checks'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the checks' Python packages
        run: python -m pip install -r requirements.txt

      - name: Set the commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          display_report: true
          prompt: |
            Read watch/weekly-watch-prompt.md and follow it.
            This run was started by: ${{ github.event_name == 'schedule' && 'the weekly schedule' || format('{0}, by hand', github.actor) }}.
            Repository: ${{ github.repository }}.
          claude_args: |
            --max-turns 300
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,WebFetch,WebSearch
